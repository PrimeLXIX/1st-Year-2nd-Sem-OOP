<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up - My Little Ponies Pet Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="general.css" class="css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-xxl">
            <span class="navbar-brand mb-0 h1">Sign up</span>
            <a class="nav-link text-white" href="login.html">Log in</a>
        </div>
    </nav>
    <div class="form-container">
        <h2>MY LITTLE PONIES</h2>
        <h3 class="text-muted">PET SPA</h3>
        <form>
            <div class="mt-3 mb-3">
                <input type="text" class="form-control" placeholder="Display name">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Password">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Re-enter password">
            </div>
            <button type="submit" class="btn btn-custom">Sign up</button>
        </form>
        <p class="mt-3">If you already have an account, <a href="login.html" class="form-footer-link">Log in</a> here.</p>
    </div>
</body>
</html>
